{% load static ui %}{% if repository and code_version %}<div class="push-notice" role="status" data-push-watch data-state-url="{% url 'code:state' repository.pk %}" data-version="{{ code_version }}" hidden><span>{% icon "git-commit" 16 %}New code was pushed to {{ repository.slug }}.</span><button type="button" class="button primary small-button" data-push-refresh>{% icon "rotate-ccw" 14 %}Refresh</button></div><script src="{% static 'landing/js/push-notice.js' %}" defer></script>{% endif %}
