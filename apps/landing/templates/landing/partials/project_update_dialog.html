<dialog class="app-dialog" id="project-{{ project.id }}-dialog"><form method="post" action="{% url 'landing:update_project' project.id %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="dialog-close" type="button" data-close-dialog aria-label="Close">×</button><span class="kicker">UPDATE PROJECT</span><h2>{{ project.title }}</h2><p>Tick milestones as you finish them. Completing every milestone marks the project shipped, and it counts as verified once its repository has code.</p><fieldset class="milestone-list"><legend>Milestones</legend>{% for milestone in project.milestones.all %}<label class="checkbox-row"><input type="checkbox" name="milestones" value="{{ milestone.id }}"{% if milestone.is_complete %} checked{% endif %}>{{ milestone.title }}</label>{% endfor %}</fieldset><label>Summary<textarea name="summary" rows="3">{{ project.summary }}</textarea></label><label>Technology stack<input name="skills" value="{{ project.skills }}" placeholder="React, Django, PostgreSQL"></label><label>Live demo URL<input name="live_url" type="url" value="{{ project.live_url }}" placeholder="https://"></label><label class="checkbox-row"><input type="checkbox" name="is_public"{% if project.is_public %} checked{% endif %}>Show on my public portfolio</label><div class="dialog-actions"><button class="button soft" type="button" data-close-dialog>Cancel</button><button class="button primary">Save project</button></div></form></dialog>
