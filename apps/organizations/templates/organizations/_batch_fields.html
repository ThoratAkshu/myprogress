<div class="org-form-row">{% for field in form %}{% if field.name == 'is_open' %}<label class="org-check span">{{ field }}<span><b>{{ field.label }}</b><small>Students can find this class and ask about it. Turn it off when the batch is full; it stays here to reopen later.</small></span></label>{% else %}<label{% if field.name == 'title' or field.name == 'description' %} class="span"{% endif %}>{{ field.label }}{{ field }}{% if field.help_text and field.name in 'area city fee seats' %}<small class="muted">{{ field.help_text }}</small>{% endif %}{% for error in field.errors %}<small class="form-error">{{ error }}</small>{% endfor %}</label>{% endif %}{% endfor %}</div>
