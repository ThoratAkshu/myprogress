<dialog class="app-dialog" id="contact-dialog"><form method="post" action="" data-contact-form>{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="dialog-close" type="button" data-close-dialog>×</button><span class="kicker">CONTACT REQUEST</span><h2>Contact <span data-contact-target>developer</span></h2><p>They will see your name, headline, the role, and your message. Email addresses are shared only if they accept.</p><label>Role<input name="role_title" required maxlength="120" placeholder="Backend Engineer (Django) · Remote"></label><label>Message<textarea name="message" rows="5" required minlength="20" maxlength="2000" placeholder="What stood out in their work, and what the role involves."></textarea></label><div class="dialog-actions"><button class="button soft" type="button" data-close-dialog>Cancel</button><button class="button primary">Send request</button></div></form></dialog>
