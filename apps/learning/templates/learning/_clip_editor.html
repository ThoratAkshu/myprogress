{% load ui %}<div class="clip-head"><b>{% icon "scissors" 15 %} Trim and cut</b><span class="clip-summary" data-clip-summary></span></div>
<div class="clip-track" data-clip-track tabindex="0" role="slider" aria-label="Timeline. Arrow keys move, I and O mark a part, Delete cuts it." aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00"><div class="clip-strip" data-clip-strip></div><div class="clip-marks" data-clip-marks></div><div class="clip-selection" data-clip-selection hidden></div><span class="clip-handle is-start" data-clip-handle="start" title="Drag to trim the start"></span><span class="clip-handle is-end" data-clip-handle="end" title="Drag to trim the end"></span><span class="clip-playhead" data-clip-playhead></span></div>
<div class="clip-actions"><button type="button" class="clip-btn is-play" data-clip-action="play">{% icon "play" 15 %} Play the edit</button><span class="clip-group"><button type="button" class="clip-btn" data-clip-action="start-here" title="Remove everything before the playhead">Start here</button><button type="button" class="clip-btn" data-clip-action="end-here" title="Remove everything after the playhead">End here</button></span><span class="clip-group"><button type="button" class="clip-btn" data-clip-action="mark-in" title="Mark where a part to cut begins (I)">Mark in</button><button type="button" class="clip-btn" data-clip-action="mark-out" title="Mark where it ends (O)">Mark out</button><button type="button" class="clip-btn is-cut" data-clip-action="cut" title="Cut the selected part (Delete)" disabled>{% icon "scissors" 15 %} Cut selection</button></span><span class="clip-group"><button type="button" class="clip-btn" data-clip-action="undo" title="Undo (Ctrl+Z)" disabled>{% icon "undo" 15 %} Undo</button><button type="button" class="clip-btn" data-clip-action="reset" disabled>Reset</button></span></div>
<ul class="clip-cuts" data-clip-cuts></ul>
